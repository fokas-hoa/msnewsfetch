[build]
  command = "python scripts/build_site.py"
  publish = "dist"
  ignore = "node ./scripts/netlify_ignore.js"

# Credit-aware deployment policy:
# - main remains the production branch.
# - branch/deploy previews are used for development and review.
# - monitoring/CI/docs-only commits are stopped by the ignore command before build.
# - only public-site/data/build-output changes proceed to a production deploy.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# HTML should revalidate so a production deploy becomes visible immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Public research data stays fresh; five minutes is intentional.
[[headers]]
  for = "/news.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=300"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"
    Cache-Control = "public, max-age=300, stale-while-revalidate=300"

# Static assets can be cached longer to reduce repeat bandwidth/requests. They are
# intentionally not immutable because filenames are stable rather than hashed.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Daily/weekly transactions update JSON + RSS together on the data branch.
# Proxying the feed does not rebuild the static site.
[[redirects]]
  from = "/rss.xml"
  to = "https://raw.githubusercontent.com/fokas-hoa/msnewsfetch/live-data/rss.xml"
  status = 200
  force = true
