name: Validate MSNewsFetch

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore structured data
        run: python scripts/restore_data.py
      - name: Generate RSS from news.json
        run: python scripts/build_rss.py
      - name: Validate research data
        run: python scripts/validate_site.py
      - name: Validate canonical programme identity registry
        run: python scripts/test_program_identity.py
      - name: Validate weekly discovery policy
        run: python scripts/test_discovery_policy.py
      - name: Validate zero-touch live feed transformation
        run: python scripts/test_live_feed.py
      - name: Verify RSS is generated from news.json
        run: python scripts/build_rss.py --check
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate Netlify credit guard
        run: node scripts/test_netlify_ignore.js
