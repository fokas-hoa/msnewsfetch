name: Weekly MS Deep Discovery

on:
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ms-weekly-deep-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore site data for known-program dedupe
        run: python scripts/restore_data.py
      - name: Restore previous discovery state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_discovery_state.py
      - name: Deep-scan core registries papers preprints grants and discovery pages
        run: python scripts/deep_discovery.py
      - name: Scan UKRI grant portfolio
        run: python scripts/ukri_discovery.py
      - name: Scan ISRCTN registry
        run: python scripts/isrctn_discovery.py
      - name: Scan CORDIS EU project portfolio
        run: python scripts/cordis_discovery.py
      - name: Retry ANZCTR with browser-compatible HTTP access
        run: python scripts/anzctr_discovery_fallback.py
      - name: Install Selenium for ANZCTR only
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0
      - name: Retry ANZCTR with headless Chrome
        run: python scripts/anzctr_browser_discovery.py
      - name: Canonicalise programme identity and score review confidence
        run: python scripts/enrich_discovery_report.py
      - name: Keep notifications high-signal
        run: python scripts/filter_discovery_report.py
      - name: Create review issue only for new high-signal candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_discovery_issue.py
      - name: Save discovery state
        uses: actions/upload-artifact@v4
        with:
          name: msnews-discovery-state
          path: monitor/discovery_state.json
          retention-days: 90
          if-no-files-found: error
      - name: Save discovery report
        uses: actions/upload-artifact@v4
        with:
          name: msnews-discovery-report
          path: monitor/discovery_report.json
          retention-days: 60
          if-no-files-found: warn
